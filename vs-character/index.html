<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="too-small">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="6" y="2.5" width="12" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <path d="M10.5 18.5h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
  <h1>Open this on a desktop</h1>
  <p>The scene is built at a fixed portrait video size and driven with the arrow keys, so it needs a larger screen and a keyboard.</p>
</div>

<main class="workspace">

  <div class="stage-area" id="stageArea">
   <div class="stage-holder" id="stageHolder">
    <div class="stage" id="stage">

      <div class="sky"></div>
      <div class="glow"></div>
      <div class="floor"></div>

      <div class="slots">
        <div class="slot" data-slot="a">
          <img class="slot-img" alt="">
          <div class="slot-empty">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <button class="slot-clear" type="button" aria-label="Remove image">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <input class="slot-file" type="file" accept="image/*" hidden>
        </div>

        <div class="slot" data-slot="b">
          <img class="slot-img" alt="">
          <div class="slot-empty">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <button class="slot-clear" type="button" aria-label="Remove image">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <input class="slot-file" type="file" accept="image/*" hidden>
        </div>
      </div>

      <div class="cast-shadow" id="castShadow"></div>

      <div class="character" id="character">
        <img class="pose is-on" data-pose="standing"       src="standing/standing.png"             alt="Character standing" fetchpriority="high">
        <img class="pose"       data-pose="pointing-left"  src="pointing-left/pointing-left.png"   alt="Character pointing left">
        <img class="pose"       data-pose="pointing-right" src="pointing-right/pointing-right.png" alt="Character pointing right">
        <img class="pose"       data-pose="shrugging"      src="shrugging/shrugging.png"           alt="Character shrugging">
        <img class="pose"       data-pose="arms-folded"    src="arms-folded/arms-folded.png"       alt="Character with arms folded">
      </div>

    </div>
   </div>
  </div>

  <aside class="controls">

    <section class="panel">
      <h2>Pose</h2>
      <div class="pad">
        <button class="key key-up" type="button" data-pose="shrugging" aria-label="Shrug">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
        </button>
        <button class="key key-left" type="button" data-pose="pointing-left" aria-label="Point left">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>
        </button>
        <button class="key key-right" type="button" data-pose="pointing-right" aria-label="Point right">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></svg>
        </button>
        <button class="key key-down" type="button" data-pose="arms-folded" aria-label="Fold arms">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m0 0 6-6m-6 6-6-6"/></svg>
        </button>
      </div>
      <p class="note">Hold an arrow key. Let go to stand.</p>
    </section>

    <section class="panel">
      <h2>Canvas</h2>
      <label class="field">
        <span>Resolution</span>
        <select id="resolution">
          <option value="1080x1920" selected>1080 &times; 1920&nbsp;&nbsp;9:16</option>
          <option value="1080x1350">1080 &times; 1350&nbsp;&nbsp;4:5</option>
          <option value="1080x1440">1080 &times; 1440&nbsp;&nbsp;3:4</option>
          <option value="720x1280">720 &times; 1280&nbsp;&nbsp;9:16</option>
        </select>
      </label>
      <label class="field">
        <span>View</span>
        <select id="zoom">
          <option value="fit" selected>Fit to window</option>
          <option value="1">100%</option>
          <option value="0.5">50%</option>
          <option value="0.25">25%</option>
        </select>
      </label>
      <p class="note" id="scaleNote"></p>
    </section>

  </aside>

</main>

<script src="script.js"></script>
</body>
</html>
